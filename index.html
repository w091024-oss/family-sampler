<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🎵 うちのサンプラー</title>

  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
      margin: 0;
      padding: 20px;
      background: #f5f5f5;
      text-align: center;
    }

    h1 {
      margin-bottom: 20px;
    }

    .sampler {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      max-width: 600px;
      margin: 0 auto;
    }

    button {
      font-size: 22px;
      font-weight: bold;
      padding: 25px 10px;
      border: none;
      border-radius: 15px;
      background: white;
      box-shadow: 0 3px 8px rgba(0,0,0,0.15);
      cursor: pointer;
    }

    button:active {
      transform: scale(0.95);
      background: #ddd;
    }
  </style>
</head>

<body>

  <h1>🎵 うちのサンプラー</h1>

  <div class="sampler" id="sampler"></div>

  <script>
    const sounds = [
  　　{ name: "あれ", file: "sounds/あれ.wav", image: "are_icon.webp" },
  　　{ name: "え、好きペ", file: "sounds/え、好きペ.wav" },
  　　{ name: "ば", file: "sounds/ば.wav" },
  　　{ name: "く", file: "sounds/く.wav" },
  　　{ name: "れ", file: "sounds/れ.wav" },
  　　{ name: "つ", file: "sounds/つ.wav" },
  　　{ name: "待って・・・。", file: "sounds/待って・・・。.wav" }
　　];

    const sampler = document.getElementById("sampler");

    sounds.forEach(sound => {
    const button = document.createElement("button");

　　if (sound.image) {
 　 const img = document.createElement("img");
 　 img.src = sound.image;
 　 img.style.width = "80px";
　  img.style.height = "80px";
 　 img.style.objectFit = "contain";
 　 button.appendChild(img);
　}

　const text = document.createElement("div");
　text.textContent = sound.name;
　button.appendChild(text);

      button.addEventListener("click", () => {
        const audio = new Audio(sound.file);
        audio.play();
      });

      sampler.appendChild(button);
    });
  </script>

</body>
</html>
