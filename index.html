<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🎵 うちのサンプラー</title>

  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
      margin: 0;
      padding: 20px;
      background: #f5f5f5;
      text-align: center;
    }

    h1 {
      margin-bottom: 20px;
    }

    .sampler {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      max-width: 600px;
      margin: 0 auto;
    }

    button {
      position: relative;
      width: 100%;
      aspect-ratio: 1 / 1;
      padding: 0;
      border: none;
      border-radius: 15px;
      overflow: hidden;
      background: white;
      box-shadow: 0 3px 8px rgba(0,0,0,0.15);
      cursor: pointer;
      color: white;
      font-size: 24px;
      font-weight: bold;
    }

    button img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    button div {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: 100%;
  text-align: center;
  color: white;
  font-family: "Arial Rounded MT Bold", "Helvetica Neue", sans-serif;
  font-size: 30px;
  font-weight: 900;
  letter-spacing: 2px;
  text-shadow:
    2px 2px 4px rgba(0, 0, 0, 0.8),
    0 0 8px rgba(0, 0, 0, 0.5);
  z-index: 2;
}

    button:active {
      transform: scale(0.95);
    }
  </style>
</head>

<body>

  <h1>🎵 うちのサンプラー</h1>

  <div class="sampler" id="sampler"></div>

  <script>
    const sounds = [
      { name: "あれ", file: "sounds/あれ.wav", image: "icons/are_icon.webp" },
      { name: "え、好きペ", file: "sounds/え、好きペ.wav", image: "icons/sukipe.webp" },
      { name: "ば", file: "sounds/ば.wav" },
      { name: "く", file: "sounds/く.wav" },
      { name: "れ", file: "sounds/れ.wav" },
      { name: "つ", file: "sounds/つ.wav" },
      { name: "待って・・・。", file: "sounds/待って・・・。.wav", image:"icons/matte.webp" },
      { name: "山中なす", file: "sounds/yamanakanasu.wav", image:"icons/yamanakanasu.webp" }
    ];

    const sampler = document.getElementById("sampler");

    sounds.forEach(sound => {
      const button = document.createElement("button");

      if (sound.image) {
        const img = document.createElement("img");
        img.src = sound.image;
        button.appendChild(img);
      }

      const text = document.createElement("div");
      text.textContent = sound.name;
      button.appendChild(text);

      button.addEventListener("click", () => {
        const audio = new Audio(sound.file);
        audio.play();
      });

      sampler.appendChild(button);
    });
  </script>

</body>
</html>
