
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🎵 うちのサンプラー</title>

  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
      margin: 0;
      padding: 20px;
      background: #f5f5f5;
      text-align: center;
    }

    h1 {
      margin-bottom: 20px;
    }

    .bank-selector {
      display: flex;
      justify-content: center;
      gap: 8px;
      max-width: 600px;
      margin: 0 auto 18px;
    }

    .bank-button {
      aspect-ratio: auto;
      width: auto;
      flex: 1;
      padding: 12px 4px;
      border-radius: 10px;
      background: #ddd;
      color: #333;
      font-size: 14px;
      box-shadow: none;
    }

    .bank-button.active {
      background: #333;
      color: white;
    }

    .sampler {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      max-width: 600px;
      margin: 0 auto;
    }

    .sampler button {
      position: relative;
      width: 100%;
      aspect-ratio: 1 / 1;
      padding: 0;
      border: none;
      border-radius: 15px;
      overflow: hidden;
      background: white;
      box-shadow: 0 3px 8px rgba(0,0,0,0.15);
      cursor: pointer;
      color: white;
      font-size: 24px;
      font-weight: bold;
    }

    .sampler button img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .sampler button div {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 100%;
      text-align: center;
      color: white;
      font-family: "Arial Rounded MT Bold", "Helvetica Neue", sans-serif;
      font-size: 30px;
      font-weight: 900;
      letter-spacing: 2px;
      text-shadow:
        2px 2px 4px rgba(0, 0, 0, 0.8),
        0 0 8px rgba(0, 0, 0, 0.5);
      z-index: 2;
    }

    .sampler button:active {
      transform: scale(0.95);
    }
  </style>
</head>

<body>

  <h1>🎵 うちのサンプラー</h1>

  <div class="bank-selector" id="bankSelector"></div>
  <div class="sampler" id="sampler"></div>

  <script>
   
const banks = {
  "BANK 1": [
    { name: "あれ", file: "sounds/あれ.wav", image: "icons/are_icon.webp" },
    { name: "え、好きペ", file: "sounds/え、好きペ.wav", image: "icons/sukipe.webp" },
    { name: "ば", file: "sounds/ば.wav", image: "icons/ba.webp" },
    { name: "く", file: "sounds/く.wav", image: "icons/ku.webp" },
    { name: "れ", file: "sounds/れ.wav", image: "icons/re.webp" },
    { name: "つ", file: "sounds/つ.wav", image: "icons/tsu.webp" }
  ],

  "BANK 2": [
    { name: "アディオス", file: "sounds/アディオス.wav", image: "icons/adios.webp" },
    { name: "待って・・・。", file: "sounds/待って・・・。.wav", image: "icons/matte.webp" },
    { name: "山中なす", file: "sounds/yamanakanasu.wav", image: "icons/yamanakanasu.webp" },
    { name: "炊飯器", file: "sounds/炊飯器.wav", image: "icons/suihanki.webp" }
  ],

  "BANK 3": [
　　{ name: "皮膚トラブル", file: "sounds/hifutoraburu.wav", image: "icons/hifutoraburu.webp" },
    { name: "ガマンしないで", file: "sounds/gamanshinaide.wav", image: "icons/gamanshinaide.webp" },
    { name: "いっしょになおそうね", file: "sounds/いっしょになおそうね.wav", image: "icons/Isshoninaosoune.webp" },
    { name: "", file: "sounds/runrunyamanaka.wav", image: "icons/runrunyamanaka.webp" },
    { name: "", file: "sounds/osharehajikoman.wav", image: "icons/osharehajikoman.webp" },
    { name: "13号", file: "sounds/おめでとう13号.wav", image: "icons/aloha.webp" }
  ],

  "BANK 4": [
    { name: "どーも山中", file: "sounds/どーも山中です.wav", image: "icons/birthday_sampler_icon.webp" },
    { name: "A", file: "sounds/ハピバスデイA.wav", image: "icons/birthday_sampler_icon.webp" },
    { name: "B", file: "sounds/ハピバスデイB.wav", image: "icons/birthday_sampler_icon.webp" },
    { name: "C", file: "sounds/ハピバスデイディア.wav", image: "icons/birthday_sampler_icon.webp" },
    { name: "！", file: "sounds/あさみさん.wav", image: "icons/birthday_sampler_icon.webp" },
    { name: "D", file: "sounds/ハピバスデイC.wav", image: "icons/birthday_sampler_icon.webp" }
  ]
};


    const sampler = document.getElementById("sampler");
    const bankSelector = document.getElementById("bankSelector");

    function showBank(bankName) {
      sampler.innerHTML = "";
      bankSelector.innerHTML = "";

      // バンク切替ボタン
      Object.keys(banks).forEach(name => {
        const bankButton = document.createElement("button");
        bankButton.className = "bank-button";
        bankButton.textContent = name;

        if (name === bankName) {
          bankButton.classList.add("active");
        }

        bankButton.addEventListener("click", () => {
          showBank(name);
        });

        bankSelector.appendChild(bankButton);
      });

      // パッドを6個表示
      for (let i = 0; i < 6; i++) {
        const sound = banks[bankName][i];
        const button = document.createElement("button");

        if (sound) {
          if (sound.image) {
            const img = document.createElement("img");
            img.src = sound.image;
            button.appendChild(img);
          }

          if (sound.name) {
            const text = document.createElement("div");
            text.textContent = sound.name;
            button.appendChild(text);
          }

          button.addEventListener("click", () => {
            const audio = new Audio(sound.file);
            audio.play();
          });
        }

        sampler.appendChild(button);
      }
    }

    // 最初はBANK 1を表示
    showBank("BANK 1");
  </script>

</body>
</html>
