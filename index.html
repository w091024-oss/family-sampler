<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>うちのサンプラー</title>
<style>
*{box-sizing:border-box}body{margin:0;padding:20px;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;background:#f5f5f5;color:#222}h1{text-align:center;font-size:26px;margin:8px 0 20px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;max-width:720px;margin:0 auto}button{min-height:105px;border:0;border-radius:18px;background:#fff;box-shadow:0 3px 10px rgba(0,0,0,.12);font-size:19px;font-weight:700;padding:14px;cursor:pointer;touch-action:manipulation}button:active{transform:scale(.97)}@media(min-width:650px){.grid{grid-template-columns:repeat(3,1fr)}}.empty{max-width:720px;margin:30px auto;text-align:center;color:#777}
</style>
</head>
<body>
<h1>🎵 うちのサンプラー</h1>
<div id="grid" class="grid"></div>
<div id="empty" class="empty" hidden>音声素材を登録すると、ここにボタンが並びます。</div>
<script>
const sounds = [
  // ここに7個の素材を登録します。
  // {name:"おはよう", file:"sounds/01_ohayou.mp3"},
];
const grid=document.getElementById('grid'), empty=document.getElementById('empty');
sounds.forEach(sound=>{
  const button=document.createElement('button');
  button.textContent=sound.name;
  button.addEventListener('click',()=>{
    const audio=new Audio(sound.file);
    audio.play().catch(e=>console.log(e));
  });
  grid.appendChild(button);
});
empty.hidden=sounds.length>0;
</script>
</body>
</html>
